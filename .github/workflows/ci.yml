name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

  build:
    needs: wrapper-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Only main writes the cache, so a PR cannot poison it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # check = unit tests (including the build-logic guard tests), Android lint
      # and detekt/ktlint for every module, and the manifest policy gate.
      # assembleRelease builds both apps with R8 and re-runs the gate.
      - name: Build, test and verify
        run: ./gradlew check assembleRelease verifyManifestPolicies --stacktrace

      - name: Release APK checksums and permissions
        run: |
          sha256sum app/build/outputs/apk/release/*.apk companion/build/outputs/apk/release/*.apk
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          for apk in app/build/outputs/apk/release/*.apk companion/build/outputs/apk/release/*.apk; do
            "$AAPT2" dump permissions "$apk"
          done

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
