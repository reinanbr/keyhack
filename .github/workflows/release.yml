name: Release

# Pushing a tag such as v0.1.0 builds, tests and signs the release APK and
# publishes it on the GitHub releases page with notes from CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # create the GitHub Release; nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      # No cache: a release is built from a clean state.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Tag matches versionName
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYHACK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::secret KEYHACK_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYHACK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build, test and verify
        env:
          KEYHACK_KEYSTORE_PASSWORD: ${{ secrets.KEYHACK_KEYSTORE_PASSWORD }}
          KEYHACK_KEY_ALIAS: ${{ secrets.KEYHACK_KEY_ALIAS }}
          KEYHACK_KEY_PASSWORD: ${{ secrets.KEYHACK_KEY_PASSWORD }}
        run: ./gradlew check assembleRelease verifyManifestPolicies --stacktrace

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify signature and package
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          mkdir dist
          for flavor in online offline; do
            apk="app/build/outputs/apk/$flavor/release/app-$flavor-release.apk"
            "$BT"apksigner verify --print-certs "$apk"
            "$BT"aapt2 dump permissions "$apk"
          done
          # The offline APK must not be able to reach the network at all.
          if "$BT"aapt2 dump permissions app/build/outputs/apk/offline/release/app-offline-release.apk | grep -q INTERNET; then
            echo "::error::offline APK requests INTERNET"
            exit 1
          fi
          cp app/build/outputs/apk/online/release/app-online-release.apk "dist/KeyHack-$VERSION.apk"
          cp app/build/outputs/apk/offline/release/app-offline-release.apk "dist/KeyHack-$VERSION-offline.apk"
          (cd dist && sha256sum -- *.apk > SHA256SUMS && cat SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "KeyHack $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
